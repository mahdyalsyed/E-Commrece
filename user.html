<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User Page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:ital@0;1&family=Roboto+Slab&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/all.min.css" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <!-- Start Header -->
        <header class="header">
            <div class="container">
                <nav class="nav">
                    <a class="title" href="index.html">Shopping Cart</a>
                    <ul class="list">
                        <li><a href="login.html">Sign in</a></li>
                        <li><a href="register.html">Sign up</a></li>
                    </ul>
                    <i id="burger-icon" class="fa-solid fa-bars"></i>

                    <ul class="loginUser">
                        <li>
                            <i class="user_icon fa fa-user-circle"></i>
                            <span class="userName">User Name</span>
                        </li>
                        <li id="favorite">
                            <a class="favorite-link" href="#">Favorite</a>
                        </li>
                        <li id="logout">
                            <a href="#">Log Out</a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="loading">
                <span class="loading-span"></span>
            </div>
        </header>
        <!-- End Header -->
        <section>
            <div class="container">
                <div class="user-box">
                    <div class="content">
                        <img src="./asstes/avatar.avif" alt="" />

                    </div>
                    <p class="user-desc">Email: <span></span></p>
                    <p class="user-product">Buying: Your Buy <span></span> Product</p>
                    <p class="user-favorites">Your Favorites: Is <span></span> Items</p>
                    <ul class="user-list">
                        <li><i class="fa-solid fa-star"></i></li>
                        <li><i class="fa-solid fa-star"></i></li>
                        <li><i class="fa-solid fa-star"></i></li>
                        <li><i class="fa-solid fa-star"></i></li>
                        <li><i class="fa-solid fa-star"></i></li>
                    </ul>
                </div>
            </div>
        </section>
        <script src="js/product.js"></script>
        <script src="js/user.js"></script>
        <script src="js/script.js"></script>

</html>
