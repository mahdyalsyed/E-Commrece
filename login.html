<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:ital@0;1&family=Roboto+Slab&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/all.min.css" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <!-- Start Header -->
        <header class="header">
            <div class="container">
                <nav class="nav">
                    <a class="title" href="index.html">Shopping Cart</a>
                    <ul class="list">
                        <li><a href="login.html">Sign in</a></li>
                        <li><a href="register.html">Sign up</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <form class="login">
            <input id="login_email" type="email" placeholder="Your Email..." required />
            <div class="login_pass">
                <input id="login_pass" type="password" placeholder="Your password" required />
                <i id="login_iconShow" class="fa fa-eye"></i>
                <i id="login_iconHide" class="fa fa-eye-slash"></i>
            </div>
            <button id="login_btn">Login</button>
        </form>
        <div class="poupep">
            <div class="poupep-content">
                <p class="poupep-desc">Email And Password Is Wrong</p>
                <i id="poupep-icon" class="fa fa-times-circle"></i>
            </div>
        </div>
        <!-- End Header -->
        <div class="loading">
            <span class="loading-span"></span>
        </div>
        <script src="js/script.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
